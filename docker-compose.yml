services:
  postgres-event:
    image: postgres:16
    environment:
      POSTGRES_DB: ${EVENTDB_NAME:-eventdb}
      POSTGRES_USER: ${EVENTDB_USER:-eventservice}
      POSTGRES_PASSWORD: ${EVENTDB_PASSWORD:-eventservice_pw}
    ports:
      - "${EVENTDB_PORT:-5432}:5432"
    volumes:
      - postgres-event-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVENTDB_USER:-eventservice} -d ${EVENTDB_NAME:-eventdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-notification:
    image: postgres:16
    environment:
      POSTGRES_DB: ${NOTIFICATIONDB_NAME:-notificationdb}
      POSTGRES_USER: ${NOTIFICATIONDB_USER:-notificationservice}
      POSTGRES_PASSWORD: ${NOTIFICATIONDB_PASSWORD:-notificationservice_pw}
    ports:
      - "${NOTIFICATIONDB_PORT:-5433}:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATIONDB_USER:-notificationservice} -d ${NOTIFICATIONDB_NAME:-notificationdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-event:
    build:
      context: ./src/EventService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__EventDb: "Host=postgres-event;Port=5432;Database=${EVENTDB_NAME:-eventdb};Username=${EVENTDB_USER:-eventservice};Password=${EVENTDB_PASSWORD:-eventservice_pw}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Redis__ConnectionString: "redis:6379"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Cors__FrontendOrigin: ${FRONTEND_ORIGIN:-http://localhost:5173}
      Otel__ExporterEndpoint: http://tempo:4317
    ports:
      - "${EVENT_API_PORT:-8080}:8080"
    depends_on:
      postgres-event:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api-notifications:
    build:
      context: ./src/NotificationService
      dockerfile: Dockerfile
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__NotificationDb: "Host=postgres-notification;Port=5432;Database=${NOTIFICATIONDB_NAME:-notificationdb};Username=${NOTIFICATIONDB_USER:-notificationservice};Password=${NOTIFICATIONDB_PASSWORD:-notificationservice_pw}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-no-reply@plataforma-eventos.local}
      Smtp__FromName: ${SMTP_FROM_NAME:-Plataforma de Eventos}
      Smtp__ToAddress: ${SMTP_TO_ADDRESS:-demo@plataforma-eventos.local}
      Otel__ExporterEndpoint: http://tempo:4317
    ports:
      - "${NOTIFICATION_API_PORT:-8081}:8080"
    depends_on:
      postgres-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./src/Frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_EVENT_URL: ${VITE_API_EVENT_URL:-http://localhost:8080}
      VITE_ADMIN_TOKEN: ${VITE_ADMIN_TOKEN:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api-event:
        condition: service_healthy

  # --- Observabilidad (Spec 02) — todas de mejor esfuerzo: api-event/api-notifications NUNCA
  # dependen de que estos contenedores estén sanos (FR-016), por eso no llevan depends_on hacia
  # ellos ni condition: service_healthy acá.
  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:latest
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - tempo
      - loki
      - prometheus

volumes:
  postgres-event-data:
  postgres-notification-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
