server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # api-event / api-notifications: logs JSON estructurados (Serilog RenderedCompactJsonFormatter,
  # Constitucion §6.1) — se parsean para promover service/level/TraceId a labels/campos de Loki.
  - job_name: app-services
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(api-event|api-notifications)"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            TraceId: TraceId
      - labels:
          level:
          service:

  # rabbitmq: best-effort (FR-005, spec.md Assumptions) — RabbitMQ no emite logs estructurados,
  # se centraliza el stdout tal cual (texto plano, sin parseo JSON).
  - job_name: rabbitmq
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/rabbitmq"
        action: keep
      - target_label: service
        replacement: rabbitmq
